<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Happy Birthday</title>

<!--
  ══════════════════════════════════════════════════════════════
  HOW TO MAKE THIS YOURS
  ══════════════════════════════════════════════════════════════
  Everything you personalize lives in ONE place: the CONFIG
  object inside the <script> tag near the bottom. Search for
  "EDIT THIS PART".

  Folder layout (GitHub Pages is CASE-SENSITIVE, so file names
  must match CONFIG exactly):

    index.html
    photos/
      birthday_bg.jpg
      mainPicture.jpg
      smiling_.jpg
      sitting_down_pose.jpg
      peace_sign_pose.jpg
      mirror_pose.jpg

  To publish on GitHub Pages:
  1. Put index.html and the photos folder in a repo
  2. Settings → Pages → Deploy from branch → main → / (root)
  3. Give it a minute, then share the link it gives you.
  ══════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,600;0,9..144,700;1,9..144,500&family=Sora:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:      #1B1330;
    --ink-2:    #271B40;
    --ink-3:    #33244F;
    --coral:    #FF6F5E;
    --coral-2:  #E85647;
    --marigold: #FFC857;
    --lilac:    #9d8dc1;
    --cream:    #FFF6E9;
    --leaf:     #4FB286;

    --serif: 'Fraunces', serif;
    --sans:  'Sora', sans-serif;
    --script:'Caveat', cursive;

    color-scheme: dark;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--ink);
    color:var(--cream);
    font-family:var(--sans);
    overflow-x:hidden;
  }

  body{
    min-height:100dvh;
    position:relative;
  }

  /* soft floating shapes for depth, purely decorative */
  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(60px);
    opacity:.35;
    z-index:0;
    pointer-events:none;
    animation:drift 22s ease-in-out infinite;
  }
  .blob.b1{ width:340px; height:340px; background:var(--coral); top:-80px; left:-100px; }
  .blob.b2{ width:280px; height:280px; background:var(--leaf); bottom:-60px; right:-80px; animation-duration:26s; animation-delay:-6s; }
  .blob.b3{ width:220px; height:220px; background:var(--marigold); top:40%; right:10%; animation-duration:19s; animation-delay:-11s; opacity:.22; }

  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(30px,-24px) scale(1.08); }
  }

  /* ---------- themed background (fades in after the first click) ---------- */
  .bg-theme{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--ink);
    opacity:0;
    pointer-events:none;
    transition:opacity 1.4s ease;
  }
  body.themed .bg-theme{ opacity:1; }

  .bg-fill, .bg-art{
    position:absolute;
    inset:0;
    background-repeat:no-repeat;
  }
  /* blurred copy fills any space the sharp image doesn't cover */
  .bg-fill{
    background-size:cover;
    background-position:center top;
    filter:blur(44px) saturate(1.1);
    transform:scale(1.2);
    opacity:.6;
  }
  /* sharp copy: whole image visible, anchored to the top so the lettering is never cropped */
  .bg-art{
    background-size:contain;
    background-position:center top;
    -webkit-mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 72%,transparent 100%);
  }
  @media (min-aspect-ratio:4/5){
    .bg-art{
      -webkit-mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%),
                         linear-gradient(to bottom,#000 72%,transparent 100%);
      -webkit-mask-composite:source-in;
              mask-image:linear-gradient(to right,transparent 0,#000 14%,#000 86%,transparent 100%),
                         linear-gradient(to bottom,#000 72%,transparent 100%);
              mask-composite:intersect;
    }
  }

  /* two scrims: a light one for the reveal (lettering shows), a flat one for reading */
  .bg-scrim{ position:absolute; inset:0; transition:opacity .9s ease; }
  .bg-scrim.flat{ background:rgba(27,19,48,.82); opacity:1; }
  .bg-scrim.grad{
    background:linear-gradient(to bottom,
      rgba(27,19,48,.04) 0%, rgba(27,19,48,.04) 42%,
      rgba(27,19,48,.88) 78%, rgba(27,19,48,.95) 100%);
    opacity:0;
  }
  body[data-screen="reveal"] .bg-scrim.flat{ opacity:0; }
  body[data-screen="reveal"] .bg-scrim.grad{ opacity:1; }
  body[data-screen="beat"]   .bg-scrim.flat{ opacity:.78; }

  #app{
    position:relative;
    z-index:1;
    min-height:100dvh;
  }

  .screen{
    min-height:100dvh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 8vh 6vw 12vh;
    position:absolute;
    inset:0;
    opacity:0;
    transform:translateY(18px);
    pointer-events:none;
    transition:opacity .55s ease, transform .55s ease;
  }

  .screen.active{
    position:relative;
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }

  .content{
    max-width:560px;
    width:100%;
    text-align:center;
  }

  .content.left{ text-align:left; }

  .eyebrow-icon{
    font-size:2.6rem;
    display:block;
    margin-bottom:1.1rem;
    animation:bob 2.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform:translateY(0) rotate(-3deg); }
    50%{ transform:translateY(-8px) rotate(3deg); }
  }

  h1,h2{
    font-family:var(--serif);
    font-weight:600;
    line-height:1.08;
    margin:0 0 .6rem;
    text-shadow:0 2px 18px rgba(27,19,48,.55);
  }

  h1{ font-size:clamp(2.2rem, 7vw, 3.6rem); }
  h2{ font-size:clamp(1.5rem, 5vw, 2.1rem); font-weight:500; }

  p{
    font-size:clamp(1rem, 2.4vw, 1.15rem);
    line-height:1.6;
    color:rgba(255,246,233,.82);
    margin:0 0 1.6rem;
  }

  .content.left p{ max-width:62ch; }

  .btn{
    font-family:var(--sans);
    font-size:1rem;
    font-weight:600;
    color:var(--ink);
    background:var(--lilac);
    border:none;
    border-radius:999px;
    padding:.9rem 1.9rem;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
    box-shadow:0 8px 24px rgba(255,200,87,.22);
  }
  .btn:hover{ transform:translateY(-2px); background:#5F35B8; color:var(--cream); }
  .btn:active{ transform:translateY(0); }
  .btn:focus-visible{ outline:3px solid var(--cream); outline-offset:3px; }

  .btn.primary{
    background:var(--coral);
    color:var(--cream);
    box-shadow:0 8px 24px rgba(255,111,94,.28);
  }
  .btn.primary:hover{ background:var(--coral-2); }

  /* ---------- reveal: the background already says "Happy Birthday" ---------- */
  .reveal-hb{ display:inline; }
  body.themed .reveal-hb{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }
  body.themed .screen[data-screen="reveal"]{ align-items:flex-end; }
  body.themed .screen[data-screen="reveal"] h1{ font-size:clamp(2.8rem, 11vw, 4.4rem); }

  /* ---------- wishes (appear one after another) ---------- */
  .wish-list{
    list-style:none;
    margin:0 0 1.8rem;
    padding:0;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:1.1rem;
  }
  .wish-list li{
    display:flex;
    gap:.85rem;
    padding-bottom:1.1rem;
    border-bottom:1px solid rgba(255,246,233,.12);
    font-size:clamp(1rem, 2.3vw, 1.08rem);
    line-height:1.55;
    color:rgba(255,246,233,.9);
  }
  .wish-list li:last-child{ border-bottom:none; padding-bottom:0; }
  .screen.active .wish-list li{
    animation:wish-in .6s ease both;
    animation-delay:calc(var(--i, 0) * .16s + .3s);
  }
  @keyframes wish-in{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .wish-mark{
    flex:none;
    color:var(--marigold);
    font-size:1.1rem;
    line-height:1.6;
  }

  /* ---------- message card ---------- */
  .letter{
    background:var(--ink-2);
    border:1px solid rgba(255,246,233,.1);
    border-radius:22px;
    padding:2rem 1.9rem;
    text-align:left;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .letter p{
    font-family:var(--serif);
    font-style:italic;
    font-size:clamp(1.02rem, 2.6vw, 1.2rem);
    color:var(--cream);
    line-height:1.7;
  }
  .letter p:last-child{ margin-bottom:0; }

  /* ---------- photo moments (between slides) ---------- */
  .polaroid{
    margin:0 auto 1.6rem;
    width:min(300px, 76vw);
    background:var(--cream);
    padding:.7rem .7rem 0;
    border-radius:6px;
    box-shadow:0 26px 60px rgba(0,0,0,.55);
    transform:rotate(var(--tilt, -2deg));
  }
  .polaroid-img{
    aspect-ratio:3/4;
    overflow:hidden;
    border-radius:3px;
    background:var(--ink-2);
  }
  .polaroid-img img, .medallion img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .7s ease;
  }
  .polaroid-img img.loaded, .medallion img.loaded{ opacity:1; }
  .polaroid figcaption{
    font-family:var(--script);
    font-size:1.6rem;
    line-height:1.15;
    color:#2a1a38;
    text-align:center;
    padding:.6rem .4rem .85rem;
  }
  .screen.active .polaroid{
    animation:polaroid-in .85s cubic-bezier(.2,.85,.3,1.15) both;
  }
  @keyframes polaroid-in{
    from{ opacity:0; transform:translateY(46px) rotate(calc(var(--tilt, -2deg) * 3)) scale(.9); }
    to  { opacity:1; transform:translateY(0)    rotate(var(--tilt, -2deg))          scale(1); }
  }
  /* the button waits a beat so the photo gets looked at */
  .screen.active .beat-btn{ animation:fade-in .5s ease 1s both; }
  @keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }

  /* ---------- final ---------- */
  .medallion{
    width:clamp(150px, 44vw, 190px);
    aspect-ratio:1/1;
    margin:0 auto 1.4rem;
    border-radius:50%;
    overflow:hidden;
    background:var(--ink-2);
    box-shadow:0 0 0 3px rgba(255,200,87,.6), 0 0 0 10px rgba(255,200,87,.12), 0 18px 50px rgba(255,111,94,.38);
  }
  .screen.active .medallion{ animation:pop-in .9s cubic-bezier(.2,.85,.3,1.2) .15s both; }
  @keyframes pop-in{
    from{ opacity:0; transform:scale(.6); }
    to  { opacity:1; transform:scale(1); }
  }
  .signature{
    font-family:var(--script);
    font-size:clamp(1.6rem, 5vw, 2.1rem);
    color:var(--marigold);
    margin-top:1.4rem;
  }
  .footnote{
    margin-top:2.2rem;
    font-size:.82rem;
    color:rgba(255,246,233,.4);
  }

  /* ---------- nav dots ---------- */
  #dots{
    position:fixed;
    left:0; right:0; bottom:5vh;
    display:flex;
    justify-content:center;
    gap:.5rem;
    z-index:5;
  }
  #dots span{
    width:7px; height:7px;
    border-radius:50%;
    background:rgba(255,246,233,.25);
    transition:background .25s ease, transform .25s ease;
  }
  #dots span.on{
    background:var(--marigold);
    transform:scale(1.3);
  }

  #back-btn{
    position:fixed;
    top:5vh; left:5vw;
    z-index:5;
    background:none;
    border:none;
    color:rgba(255,246,233,.7);
    font-family:var(--sans);
    font-size:.9rem;
    cursor:pointer;
    padding:.4rem .6rem;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  #back-btn.show{ opacity:1; pointer-events:auto; }
  #back-btn:hover{ color:var(--cream); }
  #back-btn:focus-visible{ outline:2px solid var(--cream); outline-offset:2px; }

  #confetti-canvas{
    position:fixed;
    inset:0;
    z-index:4;
    pointer-events:none;
  }

  @media (max-width:420px){
    .letter{ padding:1.6rem 1.3rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .blob, .eyebrow-icon{ animation:none; }
    .screen.active .wish-list li,
    .screen.active .polaroid,
    .screen.active .medallion{ animation:none; }
    .bg-theme, .bg-scrim{ transition:none; }
    *{ scroll-behavior:auto !important; }
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="bg-theme" aria-hidden="true">
  <div class="bg-fill" id="bg-fill"></div>
  <div class="bg-art"  id="bg-art"></div>
  <div class="bg-scrim flat"></div>
  <div class="bg-scrim grad"></div>
</div>

<canvas id="confetti-canvas"></canvas>

<main id="app">

  <section class="screen active" data-screen="gate">
    <div class="content">
      <span class="eyebrow-icon">🎂</span>
      <h1 id="gate-title">Hey, Birthday Girl</h1>
      <p>I made you something. Got a minute?</p>
      <button class="btn primary" data-action="next">Open it</button>
    </div>
  </section>

  <section class="screen" data-screen="reveal">
    <div class="content">
      <h1 id="reveal-title"><span class="reveal-hb">Happy Birthday, </span><span id="reveal-name"></span></h1>
      <p id="reveal-sub">A little something I built for you. Let us take a walk...</p>
      <button class="btn" data-action="next">Keep going</button>
    </div>
  </section>

  <section class="screen" data-screen="wishes">
    <div class="content left">
      <h2>A few things I'm hoping for you this year</h2>
      <ul class="wish-list" id="wish-list"></ul>
      <div style="text-align:center">
        <button class="btn" data-action="next">Continue</button>
      </div>
    </div>
  </section>

  <section class="screen" data-screen="message">
    <div class="content left">
      <h2>...</h2>
      <div class="letter" id="letter"></div>
      <div style="text-align:center;margin-top:1.8rem">
        <button class="btn" data-action="next">Continue</button>
      </div>
    </div>
  </section>

  <!-- photo moments are created from CONFIG.moments and slotted in between the slides above -->

  <section class="screen" data-screen="final">
    <div class="content">
      <div class="medallion" id="medallion"><img id="final-img" alt="" decoding="async"></div>
      <h1 id="final-title">Happy Birthday.</h1>
      <p id="final-line"></p>
      <div class="signature" id="final-sig"></div>
      <div class="footnote">Oh, and dark aesthetics next time 🌑</div>
    </div>
  </section>

</main>

<button id="back-btn" data-action="back">← back</button>
<nav id="dots"></nav>

<script>
/* ══════════════════════════════════════════════════════════════
   EDIT THIS PART — everything below is the actual content.
   Leave the code beneath CONFIG alone unless you want to dig in.
   ══════════════════════════════════════════════════════════════ */
const CONFIG = {
  name: "Mary",

  // Shown as the page background after the first click.
  background: "photos/birthday_bg.jpg",

  wishes: [
    "That this year stretches you in the good way  new things learned, new places seen.",
    "That the people around you are as loud about your wins as you are quiet about them.",
    "That you laugh more than you scroll.",
    "That whatever you're chasing this year, you catch it  and if you don't, that it teaches you something worth having anyway."
  ],

  // Each string becomes its own paragraph.
  message: [
    "Hey, Daddy's girl, I know you're going to have a great day.",
    "and I hope this right here adds to the number of things that make you smile today..."
  ],

  // Photo moments. Each one gets its own screen BETWEEN two slides,
  // in this order: after the reveal, after the wishes, after the
  // message, and the 4th right before the last slide.
  // Reorder them here to move them around.
  //   src     the image file
  //   caption the handwritten line under the photo
  //   alt     short description for screen readers (optional)
  //   focus   where to keep centered if it gets cropped (optional, e.g. "50% 30%")
  moments: [
    { src: "photos/smiling .jpg",          caption: "To more smiley moments and laughter... 🥂",                  alt: "Mary smiling at an outdoor table" },
    { src: "photos/sitting_down_pose.jpg", caption: "Okay, I'll leave this one here... 😂",                      alt: "Mary sitting with her chin on her hand" },
    { src: "photos/peace_sign_pose.jpg",   caption: "Peace sign. Obviously... I have my reservations though 🙂", alt: "Mary throwing a peace sign" },
  ],

  // The big photo on the last slide (shown in a circle).
  finalPhoto: { src: "photos/mainPicture.jpg", alt: "Mary with a hibiscus flower in her hair", focus: "62% 36%" },

  closingLine: "Hope today feels exactly like you deserve. It's your day,do it your way.🥂",
  signature: "Someone who's glad you exist"
};
/* ══════════════════════════════════════════════════════════════
   End of the part you need to touch.
   ══════════════════════════════════════════════════════════════ */


// ---- wire content into the page ----
document.getElementById('reveal-name').textContent = CONFIG.name;
document.getElementById('final-title').textContent = `Happy Birthday, ${CONFIG.name}.`;
document.getElementById('final-line').textContent = CONFIG.closingLine;
document.getElementById('final-sig').textContent = `— ${CONFIG.signature}`;

// wishes: built here, revealed one by one by CSS when the screen opens
const wishList = document.getElementById('wish-list');
CONFIG.wishes.forEach((w, i) => {
  const li = document.createElement('li');
  li.style.setProperty('--i', i);
  const mark = document.createElement('span');
  mark.className = 'wish-mark';
  mark.textContent = '✦';
  const span = document.createElement('span');
  span.textContent = w;
  li.appendChild(mark);
  li.appendChild(span);
  wishList.appendChild(li);
});

const letter = document.getElementById('letter');
CONFIG.message.forEach(paragraph => {
  const p = document.createElement('p');
  p.textContent = paragraph;
  letter.appendChild(p);
});

// final photo: lazy, loaded shortly before the last slide
const finalImg = document.getElementById('final-img');
if (CONFIG.finalPhoto && CONFIG.finalPhoto.src) {
  finalImg.dataset.src = CONFIG.finalPhoto.src;
  finalImg.alt = CONFIG.finalPhoto.alt || '';
  if (CONFIG.finalPhoto.focus) finalImg.style.objectPosition = CONFIG.finalPhoto.focus;
} else {
  document.getElementById('medallion').remove();
}

// ---- photo moments ----
function makeMoment(m, i){
  const s = document.createElement('section');
  s.className = 'screen';
  s.dataset.screen = 'beat';

  const content = document.createElement('div');
  content.className = 'content';

  const fig = document.createElement('figure');
  fig.className = 'polaroid';
  fig.style.setProperty('--tilt', (i % 2 === 0 ? -2.4 : 2.2) + 'deg');

  const frame = document.createElement('div');
  frame.className = 'polaroid-img';
  const img = document.createElement('img');
  img.dataset.src = m.src;               // not loaded until we're close to this screen
  img.alt = m.alt || m.caption || '';
  img.decoding = 'async';
  if (m.focus) img.style.objectPosition = m.focus;
  frame.appendChild(img);
  fig.appendChild(frame);

  if (m.caption) {
    const cap = document.createElement('figcaption');
    cap.textContent = m.caption;
    fig.appendChild(cap);
  }

  const btn = document.createElement('button');
  btn.className = 'btn beat-btn';
  btn.dataset.action = 'next';
  btn.textContent = 'Continue';

  content.appendChild(fig);
  content.appendChild(btn);
  s.appendChild(content);
  document.getElementById('app').appendChild(s);
  return s;
}

// order: gate, then each content slide followed by one photo moment, then the final slide
const app = document.getElementById('app');
const base = Array.from(app.querySelectorAll('.screen'));
const gateScreen = base[0];
const finalScreen = base[base.length - 1];
const middle = base.slice(1, -1);
const moments = CONFIG.moments || [];

const screens = [gateScreen];
middle.forEach((s, i) => {
  screens.push(s);
  if (moments[i]) screens.push(makeMoment(moments[i], i));
});
moments.slice(middle.length).forEach((m, i) => screens.push(makeMoment(m, middle.length + i)));
screens.push(finalScreen);

// ---- lazy loading for photos ----
function loadImg(img){
  const src = img.dataset.src;
  if (!src) return;
  img.removeAttribute('data-src');
  img.addEventListener('load',  () => img.classList.add('loaded'), { once: true });
  img.addEventListener('error', () => {
    console.warn('Image not found (check the file name and case):', src);
    img.classList.add('loaded');
  }, { once: true });
  img.src = src;
}
// load the current screen's photo and the next two, nothing earlier than needed
function warm(i){
  for (let k = i; k <= i + 2 && k < screens.length; k++){
    screens[k].querySelectorAll('img[data-src]').forEach(loadImg);
  }
}

// ---- themed background: preloaded quietly, shown after the first click ----
let bgState = 'idle';
function loadBg(){
  if (bgState !== 'idle' || !CONFIG.background) return;
  bgState = 'loading';
  const im = new Image();
  im.onload = () => {
    bgState = 'ready';
    const url = `url("${CONFIG.background}")`;
    document.getElementById('bg-fill').style.backgroundImage = url;
    document.getElementById('bg-art').style.backgroundImage = url;
    syncTheme();
  };
  im.onerror = () => {
    bgState = 'failed';
    console.warn('Background not found (check the file name and case):', CONFIG.background);
  };
  im.src = CONFIG.background;
}
function syncTheme(){
  document.body.classList.toggle('themed', bgState === 'ready' && current > 0);
}
window.addEventListener('load', loadBg);

// ---- screen navigation ----
let current = 0;
document.body.dataset.screen = screens[0].dataset.screen;

const dotsNav = document.getElementById('dots');
screens.forEach((_, i) => {
  const dot = document.createElement('span');
  if (i === 0) dot.classList.add('on');
  dotsNav.appendChild(dot);
});
const dotEls = Array.from(dotsNav.children);
const backBtn = document.getElementById('back-btn');

function goTo(index){
  if (index < 0 || index >= screens.length) return;
  screens[current].classList.remove('active');
  current = index;
  screens[current].classList.add('active');
  document.body.dataset.screen = screens[current].dataset.screen;
  dotEls.forEach((d,i) => d.classList.toggle('on', i === current));
  backBtn.classList.toggle('show', current > 0);

  if (current > 0) loadBg();   // in case the page-load preload hasn't started yet
  syncTheme();
  warm(current);

  if (screens[current].dataset.screen === 'reveal') burstConfetti();
  if (screens[current].dataset.screen === 'final')  burstConfetti(true);
}
warm(0);

document.body.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === 'next') goTo(current + 1);
  if (action === 'back') goTo(current - 1);
});

document.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'BUTTON') return; // let the focused button handle its own click
  if (e.key === 'ArrowRight' || e.key === 'Enter') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

// ---- confetti, one orchestrated burst, respects reduced motion ----
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animId = null;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#FF6F5E', '#FFC857', '#4FB286', '#FFF6E9'];

function burstConfetti(gentle){
  if (reduceMotion) return;
  const count = gentle ? 60 : 110;
  const originY = gentle ? canvas.height * 0.15 : -10;
  for (let i = 0; i < count; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: originY - Math.random() * 60,
      vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 3,
      size: 5 + Math.random() * 6,
      rot: Math.random() * 360,
      vrot: (Math.random() - 0.5) * 8,
      color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
      life: 0,
      maxLife: 140 + Math.random() * 60
    });
  }
  if (!animId) animate();
}

function animate(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.02;
    p.rot += p.vrot;
    p.life++;
    const fade = p.life > p.maxLife - 30 ? Math.max(0, (p.maxLife - p.life) / 30) : 1;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    ctx.restore();
  });
  particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 40);
  if (particles.length > 0){
    animId = requestAnimationFrame(animate);
  } else {
    animId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}
